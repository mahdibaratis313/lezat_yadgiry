  <script>
    // ==========================================
    // تنظیمات API و ذخیره‌سازی
    // ==========================================
    const API_KEY = "sk-ORnuiKkMVnFMY3wMQ3rKwTEhKGsvE3jQbYL8afOepMojgnfN";
    const API_URL = "https://api.gapgpt.app/v1/chat/completions";

    let userName = localStorage.getItem('science_user_name') || '';
    let userAvatar = localStorage.getItem('science_user_avatar') || '';
    let assistantTone = localStorage.getItem('science_assistant_tone') || 'معلم مهربان و راهنما';
    let conversationHistory = JSON.parse(localStorage.getItem('science_chat_history')) || [];

    // ==========================================
    // محتوای جامع ۱۵ فصل علوم پایه نهم
    // ==========================================
    const SCIENCE_KNOWLEDGE_BASE = `
[فصل ۱: مواد و نقش آن‌ها در زندگی]
- مواد خالص و ناخالص: فلزات مانند مس (Cu)، طلا (Au)، آهن (Fe) و آلومینیوم (Al) رسانای الکتریسیته و گرما بوده، چکش‌خوار و براق هستند.
- نافلزات: گوگرد (S)، اکسیژن، کلر، کربن. شبه‌فلزات مانند سیلیسیم (Si) در صنایع نیمه‌رسانا و الکترونیک کاربرد دارند.
- پلیمرها: بسپارهای طبیعی (نشاسته، سلولز، پشم، ابریشم) و مصنوعی (پلی‌اتیلن، نایلون).

[فصل ۲: رفتار اتم‌ها با یکدیگر]
- پیوند یونی: جاذبه بار مثبت (کاتیون) و منفی (آنیون). ترکیب بارز: سدیم کلرید (NaCl). رسانایی در حالت مذاب یا محلول.
- پیوند کووالانسی (اشتراکی): اشتراک الکترون بین نافلزها مانند آب (H2O)، متان (CH4) و کربن دی‌اکسید (CO2). فاقد رسانایی الکتریکی در آب.

[فصل ۳: به دنبال محیطی بهتر برای زندگی]
- هواکره و لایه‌ها: تروپوسفر، استراتوسفر حاوی ازن (O3). چرخه کربن و اثر گلخانه‌ای با گازهای CO2 و متان.
- بازیافت، نفت خام و فرآیند تقطیر جز‌به‌جز در پالایشگاه‌ها.

[فصل ۴: حرکت چیست؟]
- مسافت (کمیت نرده‌ای) و جابه‌جایی (کمیت برداری مستقیم از مبدا به مقصد).
- تندی متوسط (مسافت بر زمان) و سرعت متوسط (جابه‌جایی بر زمان). یکای استاندارد: متر بر ثانیه (m/s).
- شتاب: نسبت تغییرات سرعت به زمان (a = Δv / t). شتاب تندشونده و کندشونده.

[فصل ۵: نیرو]
- قانون اول نیوتن (لختی/اینرسی): حفظ وضعیت سکون یا سرعت ثابت بدون نیروی خالص.
- قانون دوم نیوتن: F = m · a (رابطه مستقیم شتاب با نیرو و عکس با جرم).
- قانون سوم نیوتن (کنش و واکنش): هر عملی واکنشی برابر و هم‌راستا اما خلاف جهت دارد.
- نیروی گرانش و وزن: W = m · g (شتاب گرانش زمین حدود ۹.۸ یا ۱۰ نیوتن بر کیلوگرم).

[فصل ۶: زمین‌ساخت ورقه‌ای]
- لایه‌های زمین: پوسته، گوشته (نرم‌کره نیمه‌مذاب) و هسته (مایع بیرونی و جامد درونی).
- حرکت ورقه‌های سنگ‌کره روی سست‌کره در سه مرز: واگرا (پشته‌های اقیانوسی)، همگرا (کوه‌زایی و گودال‌ها)، امتدادلغز (ایجاد زلزله و گسل).

[فصل ۷: آثاری از گذشته زمین]
- فسیل: بقایای سخت جانداران که سریع در رسوبات دور از اکسیژن دفن شده‌اند.
- فسیل‌های راهنما و تعیین سن نسبی لایه‌ها بر پایه اصل برهم‌نهش رسوبی.

[فصل ۸: فشار و آثار آن]
- تعریف فشار: P = F / A (یکای پاسکال Pa = N/m²).
- فشار مایعات: P = ρ · g · h وابسته به عمق و چگالی مایع. اصل پاسکال: انتقال یکپارچه فشار در مایع محبوس (جک هیدرولیک).
- فشار گازها و آزمایش بارومتر توریچلی (۷۶ سانتی‌متر ستون جیوه).

[فصل ۹: ماشین‌ها]
- مزیت مکانیکی: نسبت نیروی مقاوم به محرک (MA = Fr / Fe). ماشین کار را بیشتر نمی‌کند، بلکه انجام آن را آسان‌تر می‌کند.
- اهرم‌ها (سه حالت تکیه‌گاه)، قرقره‌ها (ثابت و متحرک)، سطح شیب‌دار، پیچ و چرخ و محور.

[فصل ۱۰: نگاهی به فضا]
- منظومه شمسی: خورشید، سیارات سنگی درونی (عطارد، زهره، زمین، مریخ) و سیارات گازی بیرونی (مشتری، زحل، اورانوس، نپتون).
- شهاب‌سنگ‌ها، ستاره‌ها، سال نوری و تلسکوپ‌های فضایی.

[فصل ۱۱: گوناگونی جانوران]
- رده‌بندی سیستماتیک: پروکاریوت‌ها (باکتری‌ها) و یوکاریوت‌ها (آغازیان، قارچ‌ها، گیاهان، جانوران).
- هتروتروف‌ها و اتوتروف‌ها.

[فصل ۱۲: دنیای گیاهان]
- فتوسنتز: کلروفیل، نور، آب و CO2 برای تولید گلوکز و اکسیژن.
- گیاهان بدون آوند (خزه‌ها) و گیاهان آونددار (سرخس‌ها، بازدانگان مخروطی مانند کاج و نهاندانگان گل‌دار).

[فصل ۱۳: جانوران بی‌مهره]
- اسفنج‌ها، کیسه‌تنان (مرجان‌ها و شقایق دریایی)، کرم‌ها، نرم‌تنان، بندپایان (بزرگ‌ترین شاخه شامل حشرات و عنکبوتیان)، خارپوستان.

[فصل ۱۴: جانوران مهره‌دار]
- ماهی‌ها (قلب ۲ حفره‌ای)، دوزیستان (قلب ۳ حفره‌ای)، خزندگان (خونسرد با تخم پوست‌دار)، پرندگان (خونگرم و استخوان توخالی)، پستانداران (زنده‌زا با شیردهی).

[فصل ۱۵: با هم زیستن]
- بوم‌سازگان (اکوسیستم): زنجیره و شبکه غذایی، هرم انرژی.
- روابط زیستی: همیاری (+/+)، همسفره‌گری (+/0)، صیادی و انگل‌داری (+/-).
`;

    document.addEventListener('DOMContentLoaded', () => {
      if (!userName) {
        document.getElementById('name-modal').classList.remove('hidden');
      } else {
        updateGreeting();
      }

      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').className = "fa-solid fa-sun text-sm";
      }

      renderExistingHistory();
      renderAvatarPreview();
    });

    function saveUsername() {
      const input = document.getElementById('username-input');
      const nameVal = input.value.trim();
      if (!nameVal) {
        input.classList.add('border-red-500');
        return;
      }
      userName = nameVal;
      localStorage.setItem('science_user_name', userName);
      document.getElementById('name-modal').classList.add('hidden');
      updateGreeting();
      appendMessage('assistant', `سلام ${userName} عزیز! خوش اومدی. هر کجای کتاب علوم نهم سوال داری مطرح کن تا با هم بررسی کنیم. 🌟`);
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        document.getElementById('settings-name-input').value = userName || '';
        document.getElementById('settings-tone-select').value = assistantTone;
        renderAvatarPreview();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    // آپلود و فشرده‌سازی عکس پروفایل کاربر
    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 150;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          userAvatar = canvas.toDataURL('image/jpeg', 0.8);
          renderAvatarPreview();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeAvatarImage() {
      userAvatar = '';
      renderAvatarPreview();
    }

    function renderAvatarPreview() {
      const box = document.getElementById('avatar-preview-box');
      if (userAvatar) {
        box.innerHTML = `<img src="${userAvatar}" class="w-full h-full object-cover">`;
      } else {
        box.innerHTML = `<i class="fa-solid fa-user"></i>`;
      }
    }

    function saveSettings() {
      const nameInput = document.getElementById('settings-name-input').value.trim();
      const toneInput = document.getElementById('settings-tone-select').value;
      if (nameInput) {
        userName = nameInput;
        localStorage.setItem('science_user_name', userName);
      }
      assistantTone = toneInput;
      localStorage.setItem('science_assistant_tone', assistantTone);

      if (userAvatar) {
        localStorage.setItem('science_user_avatar', userAvatar);
      } else {
        localStorage.removeItem('science_user_avatar');
      }

      updateGreeting();
      toggleSettingsModal();

      // بازسازی پیام‌ها تا آواتار جدید بلافاصله اعمال شود
      const container = document.getElementById('chat-container');
      container.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none p-4 shadow-xs max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content">
            <p id="welcome-msg-text" class="font-bold text-teal-800 dark:text-teal-400">سلام ${userName || 'دوست'} عزیز! 👋</p>
            من همراه و راهنمای تخصصی تو در درس علوم تجربی پایه نهم هستم. هر سوال درسی، فرمول، آزمایش یا نکته امتحانی داری بپرس تا با هم یاد بگیریم! 🌟
          </div>
        </div>
      `;
      renderExistingHistory();
    }

    function updateGreeting() {
      if (userName) {
        document.getElementById('user-greeting-sub').textContent = `سلام ${userName} عزیز! (${assistantTone})`;
        const welcomeText = document.getElementById('welcome-msg-text');
        if (welcomeText) {
          welcomeText.textContent = `سلام ${userName} عزیز! 👋`;
        }
      }
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        icon.className = "fa-solid fa-moon text-sm";
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        icon.className = "fa-solid fa-sun text-sm";
      }
    }

    function renderExistingHistory() {
      conversationHistory.forEach(msg => {
        appendMessageUI(msg.role, msg.content);
      });
      scrollToBottom();
    }

    function appendMessageUI(sender, text) {
      const container = document.getElementById('chat-container');
      const isUser = sender === 'user';
      
      const wrapper = document.createElement('div');
      wrapper.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;

      let avatar;
      if (isUser) {
        if (userAvatar) {
          avatar = `<div class="w-9 h-9 rounded-xl overflow-hidden shadow-sm mt-1 shrink-0 border border-slate-200 dark:border-slate-700"><img src="${userAvatar}" class="w-full h-full object-cover"></div>`;
        } else {
          avatar = `<div class="w-9 h-9 rounded-xl bg-slate-700 dark:bg-slate-600 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1"><i class="fa-solid fa-user"></i></div>`;
        }
      } else {
        avatar = `<div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1"><i class="fa-solid fa-graduation-cap"></i></div>`;
      }

      let bubbleClass = isUser
        ? 'bg-teal-600 text-white rounded-2xl rounded-tl-none'
        : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none shadow-xs';

      wrapper.innerHTML = `
        ${avatar}
        <div class="${bubbleClass} p-4 max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content">
          <p class="whitespace-pre-wrap">${escapeHtml(text)}</p>
        </div>
      `;
      container.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function appendMessage(sender, text) {
      appendMessageUI(sender, text);
      conversationHistory.push({ role: sender, content: text });
      localStorage.setItem('science_chat_history', JSON.stringify(conversationHistory));
    }

    function clearChat() {
      if (confirm('آیا می‌خواهید گفتگوی جدیدی شروع کنید؟')) {
        conversationHistory = [];
        localStorage.removeItem('science_chat_history');
        const container = document.getElementById('chat-container');
        container.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none p-4 shadow-xs max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content">
              <p id="welcome-msg-text" class="font-bold text-teal-800 dark:text-teal-400">سلام ${userName || 'دوست'} عزیز! 👋</p>
              من همراه و راهنمای تخصصی تو در درس علوم تجربی پایه نهم هستم. هر سوال درسی، فرمول، آزمایش یا نکته امتحانی داری بپرس تا با هم یاد بگیریم! 🌟
            </div>
          </div>
        `;
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function quickAsk(questionText) {
      const input = document.getElementById('user-input');
      input.value = questionText;
      document.getElementById('chat-form').dispatchEvent(new Event('submit', { cancelable: true }));
    }

    // تایپ سریع و روان بدون تاخیر
    function typeAssistantResponse(fullText) {
      const container = document.getElementById('chat-container');
      const wrapper = document.createElement('div');
      wrapper.className = `flex items-start gap-3`;
      
      const avatar = `<div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1"><i class="fa-solid fa-graduation-cap"></i></div>`;
      const bubble = document.createElement('div');
      bubble.className = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none p-4 shadow-xs max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content';
      
      const textP = document.createElement('p');
      textP.className = 'whitespace-pre-wrap cursor-blink';
      bubble.appendChild(textP);
      wrapper.innerHTML = avatar;
      wrapper.appendChild(bubble);
      container.appendChild(wrapper);
      scrollToBottom();

      let index = 0;
      const step = Math.max(3, Math.floor(fullText.length / 45)); 
      const timer = setInterval(() => {
        index += step;
        if (index >= fullText.length) {
          index = fullText.length;
          textP.textContent = fullText;
          textP.classList.remove('cursor-blink');
          clearInterval(timer);
          scrollToBottom();

          conversationHistory.push({ role: 'assistant', content: fullText });
          localStorage.setItem('science_chat_history', JSON.stringify(conversationHistory));
        } else {
          textP.textContent = fullText.substring(0, index);
          scrollToBottom();
        }
      }, 15);
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('user-input');
      const query = input.value.trim();
      if (!query) return;

      input.value = '';
      appendMessage('user', query);

      const container = document.getElementById('chat-container');
      const loadingId = 'loading-' + Date.now();
      const loadingWrapper = document.createElement('div');
      loadingWrapper.id = loadingId;
      loadingWrapper.className = `flex items-start gap-3`;
      loadingWrapper.innerHTML = `
        <div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl rounded-tr-none p-4 shadow-xs text-sm flex items-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-teal-500"></i>
          <span>در حال بررسی و نگارش پاسخ... ⏳</span>
        </div>
      `;
      container.appendChild(loadingWrapper);
      scrollToBottom();

      try {
        const systemPrompt = `تو دستیار تخصصی «علوم تجربی پایه نهم» به نام «لذت یادگیری» هستی.
نام دانش‌آموز: ${userName || 'دانش‌آموز عزیز'}.
لحن تعیین‌شده برای پاسخ‌های تو: ${assistantTone}.

قوانین مهم و غیرقابل تغییر:
۱. فقط و فقط به سوالات، مباحث، تعاریف، فرمول‌ها و نکات آزمایشگاهی کتاب علوم تجربی نهم پاسخ بده.
۲. اگر کاربر سوالی غیرمرتبط با علوم تجربی نهم یا مدرسه پرسید (مسائل سیاسی، ورزشی، سرگرمی، کدنویسی، برنامه‌های کامپیوتری و موضوعات متفرقه)، مودبانه بگو: «من دستیار اختصاصی درس علوم نهم هستم و فقط می‌تونم در زمینه مباحث این کتاب بهت کمک کنم. لطفاً یک سوال از درس علوم نهم بپرس!»
۳. تمام پاسخ‌ها باید کاملاً علمی، دقیق، مطابق با کتاب علوم تجربی نهم و با لحن '${assistantTone}' باشد.

گنجینه محتوای درسی ۱۵ فصل علوم نهم:
${SCIENCE_KNOWLEDGE_BASE}
`;

        const messagesPayload = [
          { role: "system", content: systemPrompt },
          ...conversationHistory.slice(-10).map(m => ({ role: m.role, content: m.content }))
        ];

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: messagesPayload,
            temperature: 0.4
          })
        });

        const data = await response.json();
        document.getElementById(loadingId)?.remove();

        if (data.choices && data.choices[0] && data.choices[0].message) {
          const botReply = data.choices[0].message.content;
          typeAssistantResponse(botReply);
        } else {
          appendMessage('assistant', 'متأسفانه پاسخی دریافت نشد. لطفاً دوباره تلاش کنید.');
        }
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        appendMessage('assistant', 'خطا در ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.');
      }
    }
  </script>
