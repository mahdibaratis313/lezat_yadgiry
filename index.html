<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لذت یادگیری | دستیار هوشمند علوم نهم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap');
    * { font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    .message-content img { max-width: 100%; border-radius: 0.75rem; margin-top: 0.5rem; margin-bottom: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex flex-col justify-between text-slate-800 dark:text-slate-100 transition-colors duration-300">

  <!-- مودال دریافت نام در ورود اول -->
  <div id="name-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 rounded-2xl bg-teal-500 text-white flex items-center justify-center text-2xl mx-auto shadow-lg shadow-teal-500/30">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2 class="text-xl font-extrabold text-slate-800 dark:text-white">به «لذت یادگیری» خوش آمدید! 🌟</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">برای شروع، اسمت چیه دوست من؟</p>
      <input type="text" id="username-input" placeholder="مثلاً: علی..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-2xl px-4 py-3 text-center text-base focus:outline-none focus:border-teal-500 transition">
      <button onclick="saveUsername()" class="w-full bg-teal-500 hover:bg-teal-600 active:scale-95 text-white font-bold py-3 rounded-2xl transition shadow-md shadow-teal-500/20">
        شروع یادگیری 🚀
      </button>
    </div>
  </div>

  <!-- هدر -->
  <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-xs">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-white text-lg shadow-md shadow-teal-500/20">
            <i class="fa-solid fa-chalkboard-user"></i>
          </div>
          <span class="absolute -bottom-0.5 -left-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full"></span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-slate-800 dark:text-white text-base md:text-lg">لذت یادگیری</h1>
            <span class="text-[10px] bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-400 font-semibold px-2 py-0.5 rounded-full border border-teal-200 dark:border-teal-800">علوم نهم</span>
          </div>
          <p id="user-greeting-sub" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">همراه و راهنمای درسی شما</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleDarkMode()" title="تغییر حالت تیره/روشن" class="text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 w-10 h-10 rounded-xl flex items-center justify-center transition">
          <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
        </button>
        <button onclick="clearChat()" title="گفتگوی جدید" class="text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 w-10 h-10 rounded-xl flex items-center justify-center transition">
          <i class="fa-solid fa-rotate-right text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- چت -->
  <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto">
    <!-- پیام خوش‌آمد اولیه پیش‌فرض -->
    <div class="flex items-start gap-3">
      <div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none p-4 shadow-xs max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content">
        <p id="welcome-msg-text" class="font-bold text-teal-800 dark:text-teal-400">سلام دوست عزیز! 👋</p>
        من همراه و راهنمای تو در درس علوم تجربی نهم هستم. هر کجای کتاب، آزمایش‌ها یا نمونه سوالات سوالی داری بپرس تا گام به گام با هم یاد بگیریم! 🌟
      </div>
    </div>
  </main>

  <!-- نوار پیام -->
  <footer class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 p-3 md:p-4 sticky bottom-0 z-20">
    <div class="max-w-4xl mx-auto">
      <form id="chat-form" class="flex items-center gap-2" onsubmit="handleSendMessage(event)">
        <input 
          type="text" 
          id="user-input" 
          placeholder="سوالت رو بپرس..." 
          autocomplete="off"
          class="flex-1 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm md:text-base rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 transition"
        />
        <button 
          type="submit" 
          id="send-btn"
          class="bg-teal-500 hover:bg-teal-600 active:scale-95 text-white w-12 h-12 rounded-2xl flex items-center justify-center transition shadow-md shadow-teal-500/20 shrink-0"
        >
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </div>
  </footer>

  <script>
    // ==========================================
    // تنظیمات API و کلید
    // ==========================================
    const API_KEY = "sk-ORnuiKkMVnFMY3wMQ3rKwTEhKGsvE3jQbYL8afOepMojgnfN";
    const API_URL = "https://api.gapgpt.app/v1/chat/completions";

    let userName = localStorage.getItem('science_user_name') || '';
    
    // آرایه تاریخچه گفتگو برای حفظ حافظه چت
    let conversationHistory = JSON.parse(localStorage.getItem('science_chat_history')) || [];

    // بانک تصاویر آموزشی علوم نهم (Wikimedia Commons معتبر)
    const SCIENCE_IMAGE_BANK = {
      "فلزات": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Copper_elements.jpg/440px-Copper_elements.jpg",
      "مس": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Copper_elements.jpg/440px-Copper_elements.jpg",
      "آهن": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Iron_crystals_electrolytic_1cm3.jpg/440px-Iron_crystals_electrolytic_1cm3.jpg",
      "سلول": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Animal_cell_structure_en.svg/600px-Animal_cell_structure_en.svg.png",
      "هسته": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Animal_cell_structure_en.svg/600px-Animal_cell_structure_en.svg.png",
      "منظومه شمسی": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Planets2008.jpg/800px-Planets2008.jpg",
      "سیاره": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Planets2008.jpg/800px-Planets2008.jpg",
      "فسیل": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Trilobite_fossil_01.jpg/500px-Trilobite_fossil_01.jpg",
      "فشار": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Hydraulic_press.svg/500px-Hydraulic_press.svg.png",
      "شتاب": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Velocity_vs_time_graph.svg/500px-Velocity_vs_time_graph.svg.png",
      "نیوتون": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Newton_cradle.gif/400px-Newton_cradle.gif",
      "اسید": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/PH_scale.svg/600px-PH_scale.svg.png",
      "باز": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/PH_scale.svg/600px-PH_scale.svg.png",
      "DNA": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/DNA_Simple.svg/400px-DNA_Simple.svg.png",
      "ژن": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/DNA_Simple.svg/400px-DNA_Simple.svg.png"
    };

    // محتوای جامع ۱۵ فصل علوم نهم
    const SCIENCE_KNOWLEDGE_BASE = `
تو دستیار هوشمند و تخصصی «علوم تجربی پایه نهم» هستید. شامل ۱۵ فصل کتاب درسی:
فصل ۱: مواد و نقش آن‌ها در زندگی (تفاوت فلزات و نافلزات، مس، آهن، طلا، گوگرد، واکنش‌پذیری فلزات، پیوندها).
فصل ۲: رفتار اتم‌ها با یکدیگر (پیوند یونی، پیوند کووالانسی، مولکول‌ها، یون‌ها).
فصل ۳: به دنبال مواد بهتر (پلیمرها، الیاف مصنوعی، پلاستیک‌ها، بازیافت).
فصل ۴: حرکت چه زیباست! (مسافت، جابجایی، تندی متوسط، تندی لحظه‌ای، سرعت، شتاب).
فصل ۵: نیرو (قوانین نیوتون، اینرسی، اصطکاک، نیروی گرانش، وزن).
فصل ۶: فشار و آثار آن (فشار در جامدات، فشار در مایعات، اصل پاسکال، فشار هوا، بارومتر).
فصل ۷: ورق پاره‌های زمین (ساختار درونی زمین، زمین‌ساخت ورقه‌ای، زلزله، آتشفشان).
فصل ۸: سامانه خورشیدی (سیارات درونی و بیرونی، شهاب‌سنگ‌ها، ستاره‌ها، کهکشان‌ها).
فصل ۹: با هم زیستن (بوم‌سازگان، زنجیره غذایی، شبکه غذایی، رقابت و همزیستی).
فصل ۱۰: نگاهی به فضا (تلسکوپ‌ها، سال نوری، طیف نور ستاره‌ها).
فصل ۱۱: گوناگون جانداران (طبقه‌بندی جانداران، باکتری‌ها، آغازیان، قارچ‌ها، گیاهان، جانوران).
فصل ۱۲: دنیای درون سلول (ساختار سلول گیاهی و جانوری، غشاء، هسته، سیتوپلاسم، دیواره سلولی).
فصل ۱۳: از سلول تا ارگانیسم (بافت‌های بدن، اندام‌ها، دستگاه‌های بدن).
فصل ۱۴: جانوران مهره‌دار (ماهیان، دوزیستان، خزندگان، پرندگان، پستانداران).
فصل ۱۵: با هم، برای زیستن (حفظ محیط زیست، انرژی‌های تجدیدپذیر، پایداری زمین).
`;

    document.addEventListener('DOMContentLoaded', () => {
      if (!userName) {
        document.getElementById('name-modal').classList.remove('hidden');
      } else {
        updateGreeting();
      }

      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').className = "fa-solid fa-sun text-sm";
      }

      // بارگذاری تاریخچه قبلی در UI
      renderExistingHistory();
    });

    function saveUsername() {
      const input = document.getElementById('username-input');
      const nameVal = input.value.trim();
      if (!nameVal) {
        input.classList.add('border-red-500');
        return;
      }
      userName = nameVal;
      localStorage.setItem('science_user_name', userName);
      document.getElementById('name-modal').classList.add('hidden');
      updateGreeting();
      
      appendMessage('assistant', `سلام ${userName} عزیز! خوش اومدی. از درس علوم نهم هر سوالی داری بپرس تا کمکت کنم. 🌟`);
    }

    function updateGreeting() {
      if (userName) {
        document.getElementById('user-greeting-sub').textContent = `سلام ${userName} عزیز! آماده یادگیری؟`;
        const welcomeText = document.getElementById('welcome-msg-text');
        if (welcomeText) {
          welcomeText.textContent = `سلام ${userName} عزیز! 👋`;
        }
      }
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        icon.className = "fa-solid fa-moon text-sm";
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        icon.className = "fa-solid fa-sun text-sm";
      }
    }

    function renderExistingHistory() {
      const container = document.getElementById('chat-container');
      // اگر تاریخچه وجود دارد، پیام اولیه پیش‌فرض را نگه دار و پیام‌های قبلی را اضافه کن
      conversationHistory.forEach(msg => {
        if (msg.role === 'user') {
          appendMessageUI('user', msg.content);
        } else if (msg.role === 'assistant') {
          appendMessageUI('assistant', msg.content);
        }
      });
      scrollToBottom();
    }

    function appendMessageUI(sender, text, imageUrl = null) {
      const container = document.getElementById('chat-container');
      const isUser = sender === 'user';
      
      const wrapper = document.createElement('div');
      wrapper.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;

      let avatar = isUser 
        ? `<div class="w-9 h-9 rounded-xl bg-slate-700 dark:bg-slate-600 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1"><i class="fa-solid fa-user"></i></div>`
        : `<div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1"><i class="fa-solid fa-graduation-cap"></i></div>`;

      let bubbleClass = isUser
        ? 'bg-teal-600 text-white rounded-2xl rounded-tl-none'
        : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none shadow-xs';

      let imageHtml = imageUrl ? `<img src="${imageUrl}" alt="تصویر آموزشی علوم نهم" loading="lazy">` : '';

      wrapper.innerHTML = `
        ${avatar}
        <div class="${bubbleClass} p-4 max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content">
          <p class="whitespace-pre-wrap">${escapeHtml(text)}</p>
          ${imageHtml}
        </div>
      `;
      container.appendChild(wrapper);
      scrollToBottom();
    }

    function appendMessage(sender, text, imageUrl = null) {
      appendMessageUI(sender, text, imageUrl);
      // ذخیره در تاریخچه آرایه
      conversationHistory.push({ role: sender, content: text });
      localStorage.setItem('science_chat_history', JSON.stringify(conversationHistory));
    }

    function clearChat() {
      if (confirm('آیا می‌خواهید گفتگوی جدیدی شروع کنید؟')) {
        conversationHistory = [];
        localStorage.removeItem('science_chat_history');
        const container = document.getElementById('chat-container');
        container.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tr-none p-4 shadow-xs max-w-[85%] md:max-w-lg text-sm leading-relaxed space-y-2 message-content">
              <p id="welcome-msg-text" class="font-bold text-teal-800 dark:text-teal-400">سلام ${userName || 'دوست'} عزیز! 👋</p>
              من همراه و راهنمای تو در درس علوم تجربی نهم هستم. هر کجای کتاب، آزمایش‌ها یا نمونه سوالات سوالی داری بپرس تا گام به گام با هم یاد بگیریم! 🌟
            </div>
          </div>
        `;
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('user-input');
      const query = input.value.trim();
      if (!query) return;

      input.value = '';
      appendMessage('user', query);

      // ساخت باکس لودینگ
      const container = document.getElementById('chat-container');
      const loadingId = 'loading-' + Date.now();
      const loadingWrapper = document.createElement('div');
      loadingWrapper.id = loadingId;
      loadingWrapper.className = `flex items-start gap-3`;
      loadingWrapper.innerHTML = `
        <div class="w-9 h-9 rounded-xl bg-teal-500 text-white flex items-center justify-center text-sm shrink-0 shadow-sm mt-1">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl rounded-tr-none p-4 shadow-xs text-sm flex items-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-teal-500"></i>
          <span>در حال بررسی و آماده‌سازی پاسخ... ⏳</span>
        </div>
      `;
      container.appendChild(loadingWrapper);
      scrollToBottom();

      // چک کردن تطابق عکس با کلیدواژه‌ها
      let matchedImage = null;
      for (const [keyword, imgUrl] of Object.entries(SCIENCE_IMAGE_BANK)) {
        if (query.includes(keyword)) {
          matchedImage = imgUrl;
          break;
        }
      }

      try {
        // ارسال کل تاریخچه گفتگو به همراه پرامپت سیستم و پیام جدید
        const messagesPayload = [
          {
            role: "system",
            content: `نام کاربر: ${userName || 'دانش‌آموز'}.\n${SCIENCE_KNOWLEDGE_BASE}\nلطفاً پاسخ‌ها را دقیق، علمی، روان و متناسب با کتاب علوم تجربی نهم با لحنی دوستانه و آموزشی ارائه بده.`
          },
          ...conversationHistory.slice(-12) // ارسال آخرین ۱۲ پیام برای حفظ context و عدم تجاوز از توکن‌ها
        ];

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: messagesPayload,
            temperature: 0.5
          })
        });

        const data = await response.json();
        document.getElementById(loadingId)?.remove();

        if (data.choices && data.choices[0] && data.choices[0].message) {
          const botReply = data.choices[0].message.content;
          appendMessage('assistant', botReply, matchedImage);
        } else {
          appendMessage('assistant', 'پاسخی از سرور دریافت نشد. لطفاً دوباره تلاش کنید.');
        }
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        appendMessage('assistant', 'خطا در ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.');
      }
    }
  </script>
</body>
</html>
